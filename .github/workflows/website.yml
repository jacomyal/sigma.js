name: Website

on:
  push:
    branches:
      - main

jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # The build step gets the count, not the token; an empty count hides it
      - name: Fetch GitHub stars
        run: echo "GITHUB_STARS=$(gh api repos/jacomyal/sigma.js --jq .stargazers_count)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build website
        run: npm run website:build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: packages/website/dist
          fqdn: www.sigmajs.org
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
