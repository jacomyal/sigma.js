name: Website (v4)

on:
  push:
    branches:
      - v4

jobs:
  publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Cache SNAP datasets
        uses: actions/cache@v4
        with:
          path: packages/website/public/data/*.txt.gz
          key: snap-datasets-${{ hashFiles('packages/website/scripts/datasets.mjs') }}

      - name: Build website
        run: npm run website:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/website/dist --project-name=sigma-v4
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
