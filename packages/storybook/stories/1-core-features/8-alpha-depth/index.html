<style>
  html,
  body,
  #storybook-root,
  #sigma-container {
    width: 100%;
    height: 100%;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden;
  }

  #controls {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    padding: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    font-family: sans-serif;
    font-size: 14px;
    z-index: 1000;
  }

  #controls > div {
    margin-bottom: 10px;
  }

  #controls > div:last-child {
    margin-bottom: 0;
  }

  #controls button {
    width: 100%;
    padding: 6px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 14px;
  }

  #controls button:hover {
    background: #0056b3;
  }

  #controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  #controls input[type="checkbox"] {
    cursor: pointer;
  }

  #controls input[type="range"] {
    width: 100%;
    cursor: pointer;
  }

  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-value {
    font-size: 12px;
    color: #666;
    text-align: right;
  }
</style>

<div id="sigma-container"></div>

<div id="controls">
  <div>
    <button id="shuffle">Shuffle Z-Index</button>
  </div>
  <div>
    <label>
      <input type="checkbox" id="debug-picking" />
      Show Picking Layer
    </label>
  </div>
  <div>
    <label>
      <input type="checkbox" id="debug-gpu" />
      Monitor GPU performances
    </label>
  </div>
  <div class="slider-container">
    <label>
      Cluster Alpha
      <span class="slider-value" id="alpha-value">0.50</span>
    </label>
    <input type="range" id="alpha-slider" min="0" max="1" step="0.01" value="0.5" />
  </div>
  <div class="slider-container">
    <label>
      Opaque Threshold
      <span class="slider-value" id="threshold-value">0.99</span>
    </label>
    <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.99" />
  </div>
</div>
