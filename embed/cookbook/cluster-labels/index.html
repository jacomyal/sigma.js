iv></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#D6DEEB;--1:#403F53">  </span></span><span style="--0:#D6DEEB;--1:#403F53">});</span></div></div><div class="ec-line"><div class="code"><span style="--1:#8844AE"><span style="--0:#7FDBCA">&#x3C;/</span><span style="--0:#CAECE6">script</span><span style="--0:#7FDBCA">></span></span></div></div></code></pre><div class="copy"><button title="Copy to clipboard" data-copied="Copied!" data-code="<div id=&#x22;sigma-container&#x22;></div><style>  #sigma-container {    width: 100%;    height: 100%;  }  :global(.clusters-layer) {    position: absolute;    inset: 0;    pointer-events: none;    overflow: hidden;  }  :global(.cluster-label) {    position: absolute;    transform: translate(-50%, -50%);    font-family: sans-serif;    font-variant: small-caps;    font-weight: 400;    font-size: 1.8rem;    text-shadow:      2px 2px 1px white,      -2px -2px 1px white,      -2px 2px 1px white,      2px -2px 1px white;  }</style><script>  import Graph from &#x22;graphology&#x22;;  import type { SerializedGraph } from &#x22;graphology-types&#x22;;  import iwanthue from &#x22;iwanthue&#x22;;  import Sigma, { DEFAULT_STYLES } from &#x22;sigma&#x22;;  import { layerGradient, pathLine, pathLoop } from &#x22;sigma/rendering&#x22;;  import type { Coordinates } from &#x22;sigma/types&#x22;;  const container = document.getElementById(&#x22;sigma-container&#x22;) as HTMLElement;  const res = await fetch(&#x22;/data/euroSIS.json&#x22;);  const data = await res.json();  const graph = Graph.from(data as SerializedGraph);  // Cluster definition  interface Cluster {    label: string;    x?: number;    y?: number;    color?: string;    positions: { x: number; y: number }[];  }  // Initialize clusters from graph data  const countryClusters: Record<string, Cluster> = {};  graph.forEachNode((_node, atts) => {    if (!countryClusters[atts.country]) countryClusters[atts.country] = { label: atts.country, positions: [] };  });  // Assign one color per cluster  const palette = iwanthue(Object.keys(countryClusters).length, { seed: &#x22;eurSISCountryClusters&#x22; });  for (const country in countryClusters) {    countryClusters[country].color = palette.pop();  }  // Style nodes by cluster  graph.forEachNode((node, atts) => {    const cluster = countryClusters[atts.country];    atts.color = cluster.color;    atts.size = Math.sqrt(graph.degree(node)) * 5;    cluster.positions.push({ x: atts.x, y: atts.y });  });  // Compute cluster centroids  for (const country in countryClusters) {    const c = countryClusters[country];    c.x = c.positions.reduce((acc, p) => acc + p.x, 0) / c.positions.length;    c.y = c.positions.reduce((acc, p) => acc + p.y, 0) / c.positions.length;  }  // Edges blend from their source cluster color to their target cluster color  const renderer = new Sigma(graph, container, {    primitives: {      edges: {        paths: [pathLine(), pathLoop()],        layers: [          layerGradient({            stops: [{ node: &#x22;source&#x22; }, &#x22;transparent&#x22;, { node: &#x22;target&#x22; }],          }),        ],      },    },    styles: {      edges: [DEFAULT_STYLES.edges, { size: 10 }],    },  });  // Create HTML overlay layer for cluster labels  const clustersLayer = document.createElement(&#x22;div&#x22;);  clustersLayer.className = &#x22;clusters-layer&#x22;;  for (const country in countryClusters) {    const cluster = countryClusters[country];    const viewportPos = renderer.graphToViewport(cluster as Coordinates);    const el = document.createElement(&#x22;div&#x22;);    el.className = &#x22;cluster-label&#x22;;    el.style.top = &#x60;${viewportPos.y}px&#x60;;    el.style.left = &#x60;${viewportPos.x}px&#x60;;    el.style.color = cluster.color!;    el.dataset.country = country;    el.textContent = cluster.label;    clustersLayer.appendChild(el);  }  container.appendChild(clustersLayer);  // Update label positions on each render  renderer.on(&#x22;afterRender&#x22;, () => {    for (const country in countryClusters) {      const cluster = countryClusters[country];      const el = clustersLayer.querySelector(&#x60;[data-country=&#x22;${country}&#x22;]&#x60;) as HTMLElement | null;      if (el) {        const viewportPos = renderer.graphToViewport(cluster as Coordinates);        el.style.top = &#x60;${viewportPos.y}px&#x60;;        el.style.left = &#x60;${viewportPos.x}px&#x60;;      }    }  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
