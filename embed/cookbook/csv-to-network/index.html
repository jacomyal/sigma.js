   download: true,    header: true,    delimiter: &#x22;,&#x22;,    complete: (results) => {      const graph = new Graph();      // Build a bipartite graph: institution ↔ subject      results.data.forEach((line) => {        const institution = line.name;        const acronym = line.acronym;        graph.addNode(institution, {          nodeType: &#x22;institution&#x22;,          label: [acronym, institution].filter((s) => !!s).join(&#x22; - &#x22;),        });        const subjects = (line.subject_terms.match(/(?:\* )[^\n\r]*/g) || []).map((str) => str.replace(/^\* /, &#x22;&#x22;));        subjects.forEach((subject) => {          if (!graph.hasNode(subject)) graph.addNode(subject, { nodeType: &#x22;subject&#x22;, label: subject });          graph.addEdge(institution, subject, { weight: 1 });        });      });      // Keep only the largest connected component      cropToLargestConnectedComponent(graph);      // Color nodes by type      const COLORS: Record<string, string> = { institution: &#x22;#FA5A3D&#x22;, subject: &#x22;#5A75DB&#x22; };      graph.forEachNode((node, attrs) => graph.setNodeAttribute(node, &#x22;color&#x22;, COLORS[attrs.nodeType as string]));      // Size nodes by degree      const degrees = graph.nodes().map((node) => graph.degree(node));      const minDegree = Math.min(...degrees);      const maxDegree = Math.max(...degrees);      const MIN_SIZE = 2;      const MAX_SIZE = 15;      graph.forEachNode((node) => {        const degree = graph.degree(node);        graph.setNodeAttribute(          node,          &#x22;size&#x22;,          MIN_SIZE + ((degree - minDegree) / (maxDegree - minDegree)) * (MAX_SIZE - MIN_SIZE),        );      });      // Apply circular layout, then run ForceAtlas2      circular.assign(graph);      const settings = forceAtlas2.inferSettings(graph);      forceAtlas2.assign(graph, { settings, iterations: 600 });      // Hide loader and render      const loader = document.getElementById(&#x22;loader&#x22;) as HTMLElement;      loader.style.display = &#x22;none&#x22;;      new Sigma(graph, container);    },  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
