#C792EA;--1:#8844AE">,</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#C792EA;--1:#8844AE">    </span></span><span style="--0:#C792EA;--1:#8844AE">strongGravityMode: </span><span style="--0:#7FDBCA;--1:#096E72">inferred</span><span style="--0:#C792EA;--1:#8844AE">.</span><span style="--0:#7FDBCA;--1:#096E72">strongGravityMode</span><span style="--0:#C792EA;--1:#8844AE"> ?? </span><span style="--0:#FF6A83;--1:#A24848">false</span><span style="--0:#C792EA;--1:#8844AE">,</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#C792EA;--1:#8844AE">    </span></span><span style="--0:#C792EA;--1:#8844AE">scalingRatio: </span><span style="--0:#F78C6C;--1:#AA0982">50</span><span style="--0:#C792EA;--1:#8844AE">,</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#C792EA;--1:#8844AE">  </span></span><span style="--0:#C792EA;--1:#8844AE">}</span><span style="--0:#D6DEEB;--1:#403F53">);</span></div></div><div class="ec-line"><div class="code"><span class="indent">  </span><span style="--0:#7FDBCA;--1:#096E72">layout</span><span style="--0:#C792EA;--1:#8844AE">.</span><span style="--0:#82AAFF;--1:#3B61B0">start</span><span style="--0:#D6DEEB;--1:#403F53">(</span><span style="--0:#F78C6C;--1:#AA0982">2000</span><span style="--0:#D6DEEB;--1:#403F53">);</span></div></div><div class="ec-line"><div class="code"><span style="--1:#8844AE"><span style="--0:#7FDBCA">&#x3C;/</span><span style="--0:#CAECE6">script</span><span style="--0:#7FDBCA">></span></span></div></div></code></pre><div class="copy"><button title="Copy to clipboard" data-copied="Copied!" data-code="<div id=&#x22;sigma-container&#x22;></div><style>  #sigma-container {    width: 100%;    height: 100%;  }</style><script>  import { ForceAtlas2GPULayout } from &#x22;@sigma/layout-fa2-gpu&#x22;;  import { layerBorder } from &#x22;@sigma/node-border&#x22;;  import { layerImage } from &#x22;@sigma/node-image&#x22;;  import Graph from &#x22;graphology&#x22;;  import forceAtlas2 from &#x22;graphology-layout-forceatlas2&#x22;;  import circular from &#x22;graphology-layout/circular&#x22;;  import Papa from &#x22;papaparse&#x22;;  import Sigma, { DEPTHLESS_STYLES } from &#x22;sigma&#x22;;  import { extremityArrow, layerDashed, layerFill, layerPlain, pathCurved, pathLine } from &#x22;sigma/rendering&#x22;;  import type { SDFShape } from &#x22;sigma/rendering&#x22;;  import { registerControls } from &#x22;../_controls&#x22;;  /**   * This example shows edge labels on a graph with no node labels: countries   * are identified by their flag alone, and the points are only readable on   * the edges. This needs the &#x60;edgeLabelAnchors: &#x22;allNodes&#x22;&#x60; setting, since   * by default edge labels are derived from displayed node labels.   */  type NodeStatus = &#x22;normal&#x22; | &#x22;active&#x22;;  type EdgeStatus = &#x22;normal&#x22; | &#x22;direct&#x22; | &#x22;indirect&#x22;;  const TELEVOTES_COLOR = &#x22;#C7928F&#x22;;  const JURY_COLOR = &#x22;#6F7A9E&#x22;;  const container = document.getElementById(&#x22;sigma-container&#x22;) as HTMLElement;  function sdfFlag(): SDFShape {    // language=GLSL    const glsl = /*glsl*/ &#x60;float sdf_flag(vec2 uv, float size) {  vec2 d = abs(uv) - vec2(size, size * 0.6);  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);}&#x60;;    return { name: &#x22;flag&#x22;, glsl, uniforms: [], inradiusFactor: 0.6 };  }  let votes = &#x22;both&#x22;;  let minPoints = 12;  function refresh() {    rebuildEdges();    layout.start(500);  }  registerControls({    votes: {      type: &#x22;action-select&#x22;,      label: &#x22;Votes&#x22;,      default: votes,      options: [        { label: &#x22;Televote + jury&#x22;, value: &#x22;both&#x22; },        { label: &#x22;Televote&#x22;, value: &#x22;tv&#x22; },        { label: &#x22;Jury&#x22;, value: &#x22;jury&#x22; },      ],      action: (value) => {        votes = value;        refresh();      },    },    minPoints: {      type: &#x22;action-select&#x22;,      label: &#x22;Min points&#x22;,      default: minPoints + &#x22;&#x22;,      options: [        { label: &#x22;All&#x22;, value: &#x22;1&#x22; },        { label: &#x22;8+&#x22;, value: &#x22;8&#x22; },        { label: &#x22;10+&#x22;, value: &#x22;10&#x22; },        { label: &#x22;Twelve points&#x22;, value: &#x22;12&#x22; },      ],      action: (value) => {        minPoints = +value;        refresh();      },    },  });  // The dataset is the Eurovision 2023 final: who gave how many points to  // whom, split between televote and jury votes.  // Source: https://github.com/Spijkervet/eurovision-dataset  const csv = await fetch(&#x22;/data/eurovision-2023-votes.csv&#x22;).then((res) => res.text());  const { data: rows } = Papa.parse<{ from: string; to: string; tele: string; jury: string }>(csv, {    header: true,    skipEmptyLines: true,  });  const received: Record<string, number> = {};  const countries = new Set<string>();  rows.forEach(({ from, to, tele, jury }) => {    countries.add(from);    countries.add(to);    received[to] = (received[to] ?? 0) + +tele + +jury;  });  const maxReceived = Math.max(...Object.values(received));  const graph = new Graph({ type: &#x22;directed&#x22; });  [...countries].sort().forEach((id) => {    graph.addNode(id, {      image: &#x60;https://flagcdn.com/w160/${id}.png&#x60;,      size: 5 + 5 * Math.sqrt((received[id] ?? 0) / maxReceived),    });  });  // One edge per (giver, receiver) pair; televote and jury awards merge into it.  function rebuildEdges() {    graph.clearEdges();    rows.forEach(({ from, to, tele, jury }) => {      const awards = (        [          [&#x22;tv&#x22;, +tele],          [&#x22;jury&#x22;, +jury],        ] as const      ).filter(([kind, points]) => points >= minPoints &#x26;&#x26; (votes === &#x22;both&#x22; || votes === kind));      if (!awards.length) return;      graph.addEdge(from, to, {        kind: awards.length === 2 ? &#x22;both&#x22; : awards[0][0],        label: awards.map(([kind, points]) => &#x60;${kind} ${points}&#x60;).join(&#x22;, &#x22;),        size: awards.reduce((total, [, points]) => total + points, 0) / 2,      });    });  }  rebuildEdges();  circular.assign(graph, { scale: 200 });  const renderer = new Sigma(graph, container, {    customNodeState: {      status: &#x22;normal&#x22; as NodeStatus,    },    customEdgeState: {      status: &#x22;normal&#x22; as EdgeStatus,    },    customGraphState: {      hasActiveSubgraph: false,    },    primitives: {      depthLayers: [        // normal items:        &#x22;edges&#x22;,        &#x22;nodes&#x22;,        // hovered node&#x27;s neighborhood:        &#x22;activeEdges&#x22;,        &#x22;activeNodes&#x22;,        &#x22;focusedNodes&#x22;,      ],      nodes: {        variables: { image: { type: &#x22;string&#x22;, default: &#x22;&#x22; } },        shapes: [sdfFlag()],        layers: [          layerFill(),          // &#x22;contain&#x22; keeps the whole flag in its atlas cell instead of a square center crop.          layerImage({ textureManagerOptions: { objectFit: &#x22;contain&#x22; } }),          layerBorder({            borders: [              { size: 0.08, color: &#x22;#000000&#x22; },              { color: &#x22;transparent&#x22;, fill: true },            ],          }),        ],      },      edges: {        paths: [pathLine(), pathCurved()],        extremities: [extremityArrow({ lengthRatio: 3, widthRatio: 2 })],        defaultHead: &#x22;arrow&#x22;,        variables: {          dashColor: { type: &#x22;color&#x22;, default: &#x22;transparent&#x22; },        },        layers: [          layerPlain(),          layerDashed({            dashColor: { attribute: &#x22;dashColor&#x22; },            dashSize: { value: 2, mode: &#x22;relative&#x22; },            gapSize: { value: 2, mode: &#x22;relative&#x22; },          }),        ],        label: { color: &#x22;#1c2833&#x22;, textBorder: { width: 12, color: &#x22;#ffffff&#x22; } },      },    },    styles: {      nodes: [        DEPTHLESS_STYLES.nodes,        {          color: &#x22;#e5e7eb&#x22;,          shape: &#x22;flag&#x22;,          cursor: &#x22;grab&#x22;,          // Country names only on hover: the flag is the label.          labelVisibility: { whenState: &#x22;isHovered&#x22;, then: &#x22;visible&#x22;, else: &#x22;hidden&#x22; },          labelBackgroundColor: &#x22;#ffffffcc&#x22;,          labelBackgroundPadding: 3,        },        {          matchState: &#x22;status&#x22;,          cases: {            normal: { depth: &#x22;nodes&#x22; },            active: { depth: &#x22;activeNodes&#x22; },          },        },        { whenState: &#x22;isHovered&#x22;, then: { depth: &#x22;focusedNodes&#x22; } },        { whenState: &#x22;isDragged&#x22;, then: { cursor: &#x22;grabbing&#x22; } },      ],      edges: [        DEPTHLESS_STYLES.edges,        { depth: &#x22;edges&#x22;, parallelPath: &#x22;curved&#x22;, parallelSpread: 0.5, opacity: 0.8 },        {          matchData: &#x22;kind&#x22;,          cases: {            tv: { color: TELEVOTES_COLOR },            jury: { color: JURY_COLOR },            // &#x22;both&#x22;: televote base with jury-colored dashes alternating.            both: { color: TELEVOTES_COLOR, dashColor: JURY_COLOR },          },        },        {          matchState: &#x22;status&#x22;,          cases: {            direct: { depth: &#x22;activeEdges&#x22;, opacity: 1, labelVisibility: &#x22;visible&#x22; },            indirect: { depth: &#x22;activeEdges&#x22;, opacity: 0.5 },          },        },        // During a focus, only the hovered node&#x27;s own edges keep their labels.        {          when: (_attributes, { status }, { hasActiveSubgraph }) => hasActiveSubgraph &#x26;&#x26; status !== &#x22;direct&#x22;,          then: { labelVisibility: &#x22;hidden&#x22;, opacity: 0.1 },        },      ],      stage: [{ whenState: &#x22;isDragging&#x22;, then: { cursor: &#x22;grabbing&#x22; } }],    },    settings: {      autoRescale: &#x22;once&#x22;,      itemSizesReference: &#x22;positions&#x22;,      enableNodeDrag: true,      renderEdgeLabels: true,      edgeLabelAnchors: &#x22;allNodes&#x22;,    },  });  // Dim everything but the hovered country and its direct voting partners.  function focusNode(node: string | null) {    const neighbors = node ? new Set(graph.neighbors(node)) : new Set<string>();    graph.forEachNode((n) => {      renderer.setNodeState(n, { status: node &#x26;&#x26; (n === node || neighbors.has(n)) ? &#x22;active&#x22; : &#x22;normal&#x22; });    });    graph.forEachEdge((edge, _attributes, source, target) => {      let status: EdgeStatus = &#x22;normal&#x22;;      if (source === node || target === node) status = &#x22;direct&#x22;;      else if (neighbors.has(source) &#x26;&#x26; neighbors.has(target)) status = &#x22;indirect&#x22;;      renderer.setEdgeState(edge, { status });    });    renderer.setGraphState({ hasActiveSubgraph: !!node });  }  renderer.on(&#x22;enterNode&#x22;, ({ node }) => focusNode(node));  renderer.on(&#x22;leaveNode&#x22;, () => focusNode(null));  const inferred = forceAtlas2.inferSettings(graph);  const layout = new ForceAtlas2GPULayout(renderer, {    gravity: inferred.gravity ?? 1,    slowDown: inferred.slowDown ?? 1,    strongGravityMode: inferred.strongGravityMode ?? false,    scalingRatio: 50,  });  layout.start(2000);</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
