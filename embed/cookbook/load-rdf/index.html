rgetId = parseJsonLd(v as Record<string, unknown>, graph);        } else {          globalId++;          targetId = &#x60;${v}#${globalId}&#x60;;          graph.mergeNode(targetId, { x: Math.random(), y: Math.random(), size: 6, label: String(v) });        }        graph.addDirectedEdge(id, targetId, { label: predicate });      }    }    return id;  }  const res = await fetch(&#x22;/data/pina-colada.jsonld&#x22;);  const rdf = await res.json();  const graph = new Graph({ type: &#x22;directed&#x22;, multi: true });  parseJsonLd(rdf, graph);  // Set up FA2 layout  const sensibleSettings = forceAtlas2.inferSettings(graph);  const fa2Layout = new FA2Layout(graph, { settings: sensibleSettings });  registerControls({    fa2: {      type: &#x22;toggle&#x22;,      label: &#x22;ForceAtlas2&#x22;,      default: true,      action: (running) => {        if (running) fa2Layout.start();        else fa2Layout.stop();      },    },  });  new Sigma(graph, container, {    settings: {      minCameraRatio: 0.08,      maxCameraRatio: 3,    },  });  fa2Layout.start();</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
