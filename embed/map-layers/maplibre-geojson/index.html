2;, size: 0.004 }],      edges: [DEFAULT_STYLES.edges, { color: &#x22;black&#x22;, size: 0.001 }],    },  });  const { map } = bindMaplibreLayer(renderer, {    getNodeLatLng: (attrs) => ({ lat: attrs.lat, lng: attrs.lng }),  });  // Add GeoJSON layer and click-to-marker after map loads  map.once(&#x22;load&#x22;, () => {    map.addSource(&#x22;channel-tunnel&#x22;, { type: &#x22;geojson&#x22;, data: channelTunnelGeoJSON }).addLayer({      id: &#x22;channel-tunnel-line&#x22;,      type: &#x22;line&#x22;,      source: &#x22;channel-tunnel&#x22;,      paint: {        &#x22;line-color&#x22;: &#x22;red&#x22;,        &#x22;line-width&#x22;: 3,        &#x22;line-dasharray&#x22;: [2, 2],      },    });    // Click on the stage to place a marker    let markerOnClick: null | Marker = null;    renderer.on(&#x22;clickStage&#x22;, (e) => {      const graphCoords = renderer.viewportToGraph({ x: e.event.x, y: e.event.y });      const geoCoords = graphToLatlng(graphCoords);      if (!markerOnClick) {        markerOnClick = new Marker();        markerOnClick.setLngLat(geoCoords);        markerOnClick.addTo(map);      } else {        markerOnClick.setLngLat(geoCoords);      }    });  });</script>"><div></div></button></div></figure></div> </div> </div> </div><script type="module">document.querySelectorAll(`.tabs .tab`).forEach(e=>{e.addEventListener(`click`,()=>{let t=e.dataset.tab;document.querySelectorAll(`.tab`).forEach(e=>e.classList.toggle(`active`,e.dataset.tab===t)),document.querySelectorAll(`.panel`).forEach(e=>e.classList.toggle(`active`,e.dataset.panel===t))})});</script> </body> </html>
