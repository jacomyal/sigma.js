DD;--1:#111111">(</span><span style="--0:#D7DBE0;--1:#403F53">n</span><span style="--0:#D9F5DD;--1:#111111">)</span><span style="--0:#D6DEEB;--1:#403F53"> </span><span style="--0:#C792EA;--1:#8844AE">=></span><span style="--0:#D6DEEB;--1:#403F53"> {</span></div></div><div class="ec-line"><div class="code"><span class="indent">        </span><span style="--0:#7FDBCA;--1:#096E72">renderer</span><span style="--0:#C792EA;--1:#8844AE">.</span><span style="--0:#82AAFF;--1:#3B61B0">setNodeState</span><span style="--1:#403F53"><span style="--0:#D6DEEB">(</span><span style="--0:#D7DBE0">n</span><span style="--0:#D6DEEB">, { isSelected: </span></span><span style="--0:#FF6A83;--1:#A24848">false</span><span style="--0:#D6DEEB;--1:#403F53"> });</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#D6DEEB;--1:#403F53">      </span></span><span style="--0:#D6DEEB;--1:#403F53">});</span></div></div><div class="ec-line"><div class="code"><span class="indent">      </span><span style="--0:#7FDBCA;--1:#096E72">renderer</span><span style="--0:#C792EA;--1:#8844AE">.</span><span style="--0:#82AAFF;--1:#3B61B0">setGraphState</span><span style="--0:#D6DEEB;--1:#403F53">({ selectionSize: </span><span style="--0:#F78C6C;--1:#AA0982">0</span><span style="--0:#D6DEEB;--1:#403F53"> });</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#D6DEEB;--1:#403F53">    </span></span><span style="--0:#D6DEEB;--1:#403F53">}</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#D6DEEB;--1:#403F53">  </span></span><span style="--0:#D6DEEB;--1:#403F53">});</span></div></div><div class="ec-line"><div class="code"><span style="--1:#8844AE"><span style="--0:#7FDBCA">&#x3C;/</span><span style="--0:#CAECE6">script</span><span style="--0:#7FDBCA">></span></span></div></div></code></pre><div class="copy"><button title="Copy to clipboard" data-copied="Copied!" data-code="<div id=&#x22;sigma-container&#x22;></div><style>  #sigma-container {    width: 100%;    height: 100%;  }</style><script>  import Graph from &#x22;graphology&#x22;;  import Sigma, { DEFAULT_STYLES } from &#x22;sigma&#x22;;  import type { Attributes } from &#x22;graphology-types&#x22;;  const GRID_SIZE = 8;  const SNAP_SIZE = GRID_SIZE / 4;  const GRID_COLS = 6;  const GRID_ROWS = 6;  const container = document.getElementById(&#x22;sigma-container&#x22;) as HTMLElement;  const graph = new Graph();  // Create a grid of nodes  for (let row = 0; row < GRID_ROWS; row++) {    for (let col = 0; col < GRID_COLS; col++) {      const id = &#x60;${row}-${col}&#x60;;      graph.addNode(id, {        x: col * GRID_SIZE,        y: row * GRID_SIZE,      });    }  }  // Connect neighbors (right and down)  for (let row = 0; row < GRID_ROWS; row++) {    for (let col = 0; col < GRID_COLS; col++) {      const id = &#x60;${row}-${col}&#x60;;      if (col < GRID_COLS - 1) graph.addEdge(id, &#x60;${row}-${col + 1}&#x60;);      if (row < GRID_ROWS - 1) graph.addEdge(id, &#x60;${row + 1}-${col}&#x60;);    }  }  const renderer: Sigma<Attributes, Attributes, Attributes, { isSelected: boolean }, {}, { selectionSize: number }> =    new Sigma(graph, container, {      customNodeState: {        isSelected: false,      },      customGraphState: {        selectionSize: 0,      },      settings: {        autoRescale: &#x22;once&#x22;,        itemSizesReference: &#x22;positions&#x22;,        enableNodeDrag: true,        // Multi-node drag: if the dragged node is selected, drag the whole selection        getDraggedNodes: (node) => {          if (renderer.getNodeState(node).isSelected) {            return graph.filterNodes((n: string) => renderer.getNodeState(n).isSelected);          }          return [node];        },        // Snap positions to sub-grid        dragPositionToAttributes: (position) => ({          x: Math.round(position.x / SNAP_SIZE) * SNAP_SIZE,          y: Math.round(position.y / SNAP_SIZE) * SNAP_SIZE,        }),      },      styles: {        nodes: [          DEFAULT_STYLES.nodes,          {            color: &#x22;grey&#x22;,            size: 2,            backdropColor: &#x22;#ffffff&#x22;,            backdropShadowColor: &#x22;transparent&#x22;,            backdropBorderColor: &#x22;black&#x22;,            backdropBorderWidth: 2,            backdropPadding: 4,            cursor: &#x22;grab&#x22;,          },          {            when: (_, state, graphState) =>              (!!graphState.selectionSize &#x26;&#x26; !state.isSelected) ||              (!graphState.selectionSize &#x26;&#x26; graphState.isDragging &#x26;&#x26; !state.isDragged),            then: {              color: &#x22;lightgrey&#x22;,            },          },          // Selected nodes          {            whenState: &#x22;isSelected&#x22;,            then: {              backdropVisibility: &#x22;visible&#x22;,            },          },          // Dragged nodes appear on top          {            whenState: &#x22;isDragged&#x22;,            then: {              depth: &#x22;topNodes&#x22;,              cursor: &#x22;grabbing&#x22;,            },          },        ],        edges: {          size: 1,          color: (_, _state, graphState) => (graphState.selectionSize || graphState.isDragging ? &#x22;lightgrey&#x22; : &#x22;grey&#x22;),        },        stage: {          whenState: &#x22;isDragging&#x22;,          then: { cursor: &#x22;grabbing&#x22; },        },      },    });  // Click to toggle selection, shift+click for multi-select  renderer.on(&#x22;clickNode&#x22;, ({ node, event }) => {    const isSelected = renderer.getNodeState(node).isSelected;    let selectionSize = renderer.getGraphState().selectionSize ?? 0;    if (!event.original.shiftKey) {      // Clear previous selection      selectionSize = 0;      graph.forEachNode((n) => {        if (renderer.getNodeState(n).isSelected) {          renderer.setNodeState(n, { isSelected: false });        }      });    }    selectionSize += !isSelected ? 1 : -1;    renderer.setNodeState(node, { isSelected: !isSelected });    renderer.setGraphState({ selectionSize: Math.max(selectionSize, 0) });  });  // Click on stage clears selection  renderer.on(&#x22;clickStage&#x22;, () => {    renderer.setGraphState({ selectionSize: 0 });    graph.forEachNode((n) => {      if (renderer.getNodeState(n).isSelected) {        renderer.setNodeState(n, { isSelected: false });      }    });  });  // Reset selection state on start dragging an unselected node  renderer.on(&#x22;nodeDragStart&#x22;, ({ node }) => {    if (!renderer.getNodeState(node).isSelected) {      graph.forEachNode((n) => {        renderer.setNodeState(n, { isSelected: false });      });      renderer.setGraphState({ selectionSize: 0 });    }  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
