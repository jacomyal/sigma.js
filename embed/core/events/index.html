 itemType === &#x22;node&#x22; ? graph.getNodeAttribute(item, &#x22;label&#x22;) : graph.getEdgeAttribute(item, &#x22;label&#x22;);        message += &#x60;, ${itemType} ${label || &#x22;with no label&#x22;} (id &#x22;${item}&#x22;)&#x60;;        if (itemType === &#x22;edge&#x22;) {          message += &#x60;, source ${graph.getSourceAttribute(item, &#x22;label&#x22;)}, target: ${graph.getTargetAttribute(            item,            &#x22;label&#x22;,          )}&#x60;;        }      }    }    div.innerHTML = &#x60;<span>${message}</span>&#x60;;    logsDOM.appendChild(div);    logsDOM.scrollTo({ top: logsDOM.scrollHeight });    if (logsDOM.children.length > 50) logsDOM.children[0].remove();  }  const renderer = new Sigma(graph, container, {    settings: {      enableEdgeEvents: true,      nodeLabelEvents: &#x22;separate&#x22;,      edgeLabelEvents: &#x22;separate&#x22;,      renderEdgeLabels: true,      edgePickingPadding: 30,    },    styles: {      edges: [        DEFAULT_STYLES.edges,        { labelPosition: &#x22;above&#x22; },        { whenState: &#x22;isHovered&#x22;, then: { color: &#x22;#cc0000&#x22; } },        { whenState: &#x22;isLabelHovered&#x22;, then: { labelColor: &#x22;#cc0000&#x22;, labelDepth: &#x22;topEdges&#x22; } },      ],      nodes: [        DEFAULT_STYLES.nodes,        { whenState: &#x22;isLabelHovered&#x22;, then: { labelColor: &#x22;#cc0000&#x22;, depth: &#x22;topNodes&#x22; } },      ],    },  });  const nodeEvents = [    &#x22;enterNode&#x22;,    &#x22;leaveNode&#x22;,    &#x22;downNode&#x22;,    &#x22;clickNode&#x22;,    &#x22;rightClickNode&#x22;,    &#x22;doubleClickNode&#x22;,    &#x22;wheelNode&#x22;,  ] as const;  const edgeEvents = [    &#x22;enterEdge&#x22;,    &#x22;leaveEdge&#x22;,    &#x22;downEdge&#x22;,    &#x22;clickEdge&#x22;,    &#x22;rightClickEdge&#x22;,    &#x22;doubleClickEdge&#x22;,    &#x22;wheelEdge&#x22;,  ] as const;  const nodeLabelEvents = [    &#x22;enterNodeLabel&#x22;,    &#x22;leaveNodeLabel&#x22;,    &#x22;downNodeLabel&#x22;,    &#x22;upNodeLabel&#x22;,    &#x22;clickNodeLabel&#x22;,  ] as const;  const edgeLabelEvents = [    &#x22;enterEdgeLabel&#x22;,    &#x22;leaveEdgeLabel&#x22;,    &#x22;downEdgeLabel&#x22;,    &#x22;upEdgeLabel&#x22;,    &#x22;clickEdgeLabel&#x22;,  ] as const;  const stageEvents = [&#x22;downStage&#x22;, &#x22;clickStage&#x22;, &#x22;doubleClickStage&#x22;, &#x22;wheelStage&#x22;] as const;  nodeEvents.forEach((eventType) => {    renderer.on(eventType, ({ node }: SigmaNodeEventPayload) => {      logEvent(eventType, &#x22;node&#x22;, node);    });  });  edgeEvents.forEach((eventType) => {    renderer.on(eventType, ({ edge }: SigmaEdgeEventPayload) => {      logEvent(eventType, &#x22;edge&#x22;, edge);    });  });  nodeLabelEvents.forEach((eventType) => {    renderer.on(eventType, ({ node }: SigmaNodeLabelEventPayload) => {      logEvent(eventType, &#x22;node&#x22;, node);    });  });  edgeLabelEvents.forEach((eventType) => {    renderer.on(eventType, ({ edge }: SigmaEdgeLabelEventPayload) => {      logEvent(eventType, &#x22;edge&#x22;, edge);    });  });  stageEvents.forEach((eventType) => {    renderer.on(eventType, ({ event }: SigmaStageEventPayload) => {      logEvent(eventType, &#x22;positions&#x22;, event);    });  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
