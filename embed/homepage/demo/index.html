pan><span style="--0:#C792EA;--1:#8844AE">.</span><span style="--0:#82AAFF;--1:#3B61B0">on</span><span style="--0:#D6DEEB;--1:#403F53">(</span><span style="--0:#D9F5DD;--1:#111111">"</span><span style="--0:#ECC48D;--1:#984E4D">leaveNode</span><span style="--0:#D9F5DD;--1:#111111">"</span><span style="--0:#D6DEEB;--1:#403F53">, </span><span style="--0:#D9F5DD;--1:#111111">()</span><span style="--0:#D6DEEB;--1:#403F53"> </span><span style="--0:#C792EA;--1:#8844AE">=></span><span style="--0:#D6DEEB;--1:#403F53"> {</span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--1:#403F53">    </span></span><span style="--0:#D7DBE0;--1:#403F53">hoveredNode</span><span style="--0:#D6DEEB;--1:#403F53"> </span><span style="--0:#C792EA;--1:#8844AE">=</span><span style="--0:#D6DEEB;--1:#403F53"> </span><span style="--0:#FF6A83;--1:#A24848">null</span><span style="--0:#D6DEEB;--1:#403F53">;</span></div></div><div class="ec-line"><div class="code"><span class="indent">    </span><span style="--0:#82AAFF;--1:#3B61B0">focusNode</span><span style="--1:#403F53"><span style="--0:#D6DEEB">(</span><span style="--0:#D7DBE0">selectedNode</span><span style="--0:#D6DEEB">);</span></span></div></div><div class="ec-line"><div class="code"><span class="indent"><span style="--0:#D6DEEB;--1:#403F53">  </span></span><span style="--0:#D6DEEB;--1:#403F53">});</span></div></div><div class="ec-line"><div class="code"><span style="--1:#8844AE"><span style="--0:#7FDBCA">&#x3C;/</span><span style="--0:#CAECE6">script</span><span style="--0:#7FDBCA">></span></span></div></div></code></pre><div class="copy"><button title="Copy to clipboard" data-copied="Copied!" data-code="<div id=&#x22;sigma-container&#x22;></div><aside id=&#x22;legend&#x22; class=&#x22;example-panel&#x22;>  <section>    <h4>About this graph</h4>    <p>      The ~9,000 most-cited AI papers from <a href=&#x22;https://openalex.org&#x22; target=&#x22;_blank&#x22; rel=&#x22;noopener&#x22;>OpenAlex</a>,      clustered with <a href=&#x22;https://en.wikipedia.org/wiki/Louvain_method&#x22; target=&#x22;_blank&#x22; rel=&#x22;noopener&#x22;>Louvain</a>      in <a href=&#x22;https://gephi.org/gephi-lite&#x22; target=&#x22;_blank&#x22; rel=&#x22;noopener&#x22;>Gephi Lite</a>.    </p>  </section>  <section>    <h4>Nodes</h4>    <div class=&#x22;legend-item&#x22;>      <svg viewBox=&#x22;0 0 16 16&#x22; class=&#x22;legend-node-icon&#x22;>        <polygon points=&#x22;8,1 15,8 8,15 1,8&#x22; fill=&#x22;none&#x22; stroke=&#x22;currentColor&#x22; stroke-width=&#x22;1.5&#x22;></polygon>      </svg>      <span>Scientific paper</span>    </div>    <div class=&#x22;legend-subitems&#x22;>      <p>Colors: research community</p>      <p>Sizes: citation count</p>    </div>  </section>  <section>    <h4>Edges</h4>    <div class=&#x22;legend-item&#x22;>      <svg width=&#x22;32&#x22; height=&#x22;12&#x22; viewBox=&#x22;0 0 32 12&#x22;>        <line x1=&#x22;2&#x22; y1=&#x22;6&#x22; x2=&#x22;24&#x22; y2=&#x22;6&#x22; stroke=&#x22;#e3a95b&#x22; stroke-width=&#x22;2&#x22;></line>        <polygon points=&#x22;24,3 32,6 24,9&#x22; fill=&#x22;#e3a95b&#x22;></polygon>      </svg>      <span>A cites B</span>    </div>    <div class=&#x22;legend-item&#x22;>      <svg width=&#x22;32&#x22; height=&#x22;12&#x22; viewBox=&#x22;0 0 32 12&#x22;>        <line x1=&#x22;2&#x22; y1=&#x22;6&#x22; x2=&#x22;30&#x22; y2=&#x22;6&#x22; stroke=&#x22;#e22653&#x22; stroke-width=&#x22;2&#x22;></line>      </svg>      <span>A and B share authors</span>    </div>  </section>  <div class=&#x22;legend-search&#x22;>    <input type=&#x22;search&#x22; id=&#x22;search-input&#x22; list=&#x22;suggestions&#x22; placeholder=&#x22;Search a paper…&#x22; />    <datalist id=&#x22;suggestions&#x22;></datalist>  </div></aside><style>  @import &#x22;../../styles/base.css&#x22;;  @import &#x22;../../styles/example-panel.css&#x22;;  #sigma-container {    width: 100%;    height: 100%;  }  #legend {    top: 1em;    right: 1em;    max-width: 210px;  }  .legend-node-icon {    width: 16px;    height: 16px;    flex-shrink: 0;  }</style><script>  import Sigma, { DEPTHLESS_STYLES } from &#x22;sigma&#x22;;  import { extremityArrow, layerFill, layerPlain, pathCurved, pathLine, pathLoop, sdfDiamond } from &#x22;sigma/rendering&#x22;;  import { layerBorder } from &#x22;@sigma/node-border&#x22;;  import type { Coordinates, LabelAttachmentContent, LabelAttachmentContext } from &#x22;sigma/types&#x22;;  import { nodeExtent } from &#x22;graphology-metrics/graph/extent&#x22;;  import { bindWebGLLayer, createColorLayerProgram } from &#x22;@sigma/layer-webgl&#x22;;  import { loadDataset } from &#x22;./load-dataset&#x22;;  import { escape } from &#x22;lodash-es&#x22;;  type NodeStatus = &#x22;normal&#x22; | &#x22;active&#x22;;  type EdgeStatus = &#x22;normal&#x22; | &#x22;direct&#x22; | &#x22;indirect&#x22;;  const FONT_FAMILY = &#x27;&#x22;Public Sans&#x22;, Lato, Arial, sans-serif&#x27;;  const BACKGROUND = &#x22;#f0f0f0&#x22;;  const NODES_PALETTE = {    0: &#x22;#756cff&#x22;,    1: &#x22;#ef368b&#x22;,    2: &#x22;#011acc&#x22;,    3: &#x22;#b900af&#x22;,    4: &#x22;#201887&#x22;,    5: &#x22;#c904ff&#x22;,  };  const EDGE_PALETTE = {    cites: &#x22;#e3a95b&#x22;,    coauthored: &#x22;#e22653&#x22;,  };  const measureCtx = document.createElement(&#x22;canvas&#x22;).getContext(&#x22;2d&#x22;)!;  function drawAuthorInfo({ attributes }: LabelAttachmentContext): LabelAttachmentContent {    const fontSize = 11;    const author = attributes.author as string;    measureCtx.font = &#x60;${fontSize}px ${FONT_FAMILY}&#x60;;    const width = Math.ceil(measureCtx.measureText(author).width) + 8;    return {      type: &#x22;svg&#x22;,      svg: &#x60;<svg xmlns=&#x22;http://www.w3.org/2000/svg&#x22; width=&#x22;${width}&#x22; height=&#x22;19&#x22;>        <text x=&#x22;4&#x22; y=&#x22;13&#x22; font-family=&#x27;${FONT_FAMILY}&#x27; font-size=&#x22;${fontSize}&#x22; fill=&#x22;#333&#x22;>${escape(author)}</text>      </svg>&#x60;,    };  }  const graph = await loadDataset();  const [minScore, maxScore] = nodeExtent(graph, &#x22;score&#x22;);  const renderer = new Sigma(graph, document.getElementById(&#x22;sigma-container&#x22;) as HTMLElement, {    customNodeState: {      // &#x22;normal&#x22;: no active subgraph, or node covered by overlay      // &#x22;active&#x22;: in the active subgraph      status: &#x22;normal&#x22; as NodeStatus,    },    customEdgeState: {      // &#x22;normal&#x22;: no active subgraph, or edge covered by overlay      // &#x22;direct&#x22;: connects the active node to its neighbor      // &#x22;indirect&#x22;: connects two neighbors of the active node      status: &#x22;normal&#x22; as EdgeStatus,    },    customGraphState: {      hasActiveSubgraph: false,    },    primitives: {      depthLayers: [        // for &#x22;normal&#x22; items:        &#x22;edges&#x22;,        &#x22;nodes&#x22;,        // an overlay to grey out hidden items (when there is an active graph):        &#x22;overlay&#x22;,        // for the active subgraph:        &#x22;activeEdges&#x22;,        &#x22;activeNodes&#x22;,        // for the active node itself:        &#x22;focusedNodes&#x22;,      ],      nodes: {        shapes: [sdfDiamond()],        layers: [          layerFill(),          layerBorder({            borders: [              { size: 0.1, color: &#x22;white&#x22;, mode: &#x22;relative&#x22; },              { fill: true, color: { attribute: &#x22;color&#x22; } },            ],          }),        ],        labelAttachments: {          authorInfo: drawAuthorInfo,        },      },      edges: {        paths: [pathLine(), pathCurved(), pathLoop()],        extremities: [extremityArrow({ lengthRatio: 6, widthRatio: 4 })],        layers: [layerPlain()],      },    },    styles: {      stage: {        background: BACKGROUND,      },      nodes: [        DEPTHLESS_STYLES.nodes,        {          color: {            attribute: &#x22;modularityClass&#x22;,            dict: NODES_PALETTE,          },          labelFont: FONT_FAMILY,          backdropShadowColor: &#x22;transparent&#x22;,          backdropLabelPadding: 10,          labelBackgroundColor: &#x22;#ffffff66&#x22;,          size: {            attribute: &#x22;score&#x22;,            min: 50,            max: 200,            minValue: minScore,            maxValue: maxScore,          },        },        {          matchState: &#x22;status&#x22;,          cases: {            normal: { depth: &#x22;nodes&#x22; },            active: { depth: &#x22;activeNodes&#x22; },          },        },        {          when: (_attributes, { isHovered, isHighlighted }) => isHovered || isHighlighted,          then: {            depth: &#x22;focusedNodes&#x22;,            labelVisibility: &#x22;visible&#x22;,            labelAttachment: &#x22;authorInfo&#x22;,            backdropVisibility: &#x22;visible&#x22;,          },        },        {          when: (_attributes, { status }, { hasActiveSubgraph }) => hasActiveSubgraph &#x26;&#x26; status === &#x22;normal&#x22;,          then: {            labelVisibility: &#x22;hidden&#x22;,          },        },      ],      edges: [        DEPTHLESS_STYLES.edges,        {          depth: &#x22;edges&#x22;,          path: &#x22;straight&#x22;,          parallelPath: &#x22;curved&#x22;,          selfLoopPath: &#x22;loop&#x22;,          opacity: 0.2,          size: 25,          color: { attribute: &#x22;type&#x22;, dict: EDGE_PALETTE },        },        {          matchData: &#x22;type&#x22;,          cases: {            cites: { head: &#x22;arrow&#x22; },          },        },        {          matchState: &#x22;status&#x22;,          cases: {            direct: { depth: &#x22;activeEdges&#x22;, opacity: 1, size: 50 },            indirect: { depth: &#x22;activeEdges&#x22;, opacity: 0.5, size: 50 },          },        },      ],    },    settings: {      itemSizesReference: &#x22;positions&#x22;,      labelDensity: 0.5,      labelRenderedSizeThreshold: 6,    },  });  const Overlay = createColorLayerProgram({ color: &#x60;${BACKGROUND}00&#x60; });  bindWebGLLayer(&#x22;overlay&#x22;, renderer, Overlay);  // Build title-to-node index for search  const titleToNode = new Map<string, string>();  graph.forEachNode((node, attrs) => {    titleToNode.set(attrs.label as string, node);  });  // Interaction state  let hoveredNode: string | null = null;  let selectedNode: string | null = null;  let previouslyHighlightedNode: string | null = null;  const searchInput = document.getElementById(&#x22;search-input&#x22;) as HTMLInputElement;  const searchSuggestions = document.getElementById(&#x22;suggestions&#x22;) as HTMLDataListElement;  function focusNode(node: string | null) {    if (node) {      const neighbors = new Set(graph.neighbors(node));      graph.forEachNode((n) => {        const isActive = n === node || neighbors.has(n);        renderer.setNodeState(n, { status: isActive ? &#x22;active&#x22; : &#x22;normal&#x22; });      });      graph.forEachEdge((edge) => {        const [source, target] = graph.extremities(edge);        const sourceIsFocus = source === node;        const targetIsFocus = target === node;        let status: EdgeStatus = &#x22;normal&#x22;;        if (sourceIsFocus || targetIsFocus) {          status = &#x22;direct&#x22;;        } else if (neighbors.has(source) &#x26;&#x26; neighbors.has(target)) {          status = &#x22;indirect&#x22;;        }        renderer.setEdgeState(edge, { status });      });    } else {      graph.forEachNode((n) => renderer.setNodeState(n, { status: &#x22;normal&#x22; }));      graph.forEachEdge((e) => renderer.setEdgeState(e, { status: &#x22;normal&#x22; }));    }    Overlay.setColor(node ? &#x60;${BACKGROUND}cc&#x60
