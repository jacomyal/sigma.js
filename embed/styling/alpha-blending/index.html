  import { layerBorder } from &#x22;@sigma/node-border&#x22;;  import Graph from &#x22;graphology&#x22;;  import Sigma, { DEFAULT_STYLES } from &#x22;sigma&#x22;;  import { registerControls } from &#x22;../_controls&#x22;;  const container = document.getElementById(&#x22;sigma-container&#x22;) as HTMLElement;  const { bgColor, useColorAlpha, nodeOpacity, edgeOpacity, edgeSize } = registerControls({    bgColor: {      type: &#x22;select&#x22;,      label: &#x22;Background&#x22;,      default: &#x22;#ffffff&#x22;,      options: [        { label: &#x22;White&#x22;, value: &#x22;#ffffff&#x22; },        { label: &#x22;Light gray&#x22;, value: &#x22;#e0e0e0&#x22; },        { label: &#x22;Dark gray&#x22;, value: &#x22;#333333&#x22; },        { label: &#x22;Black&#x22;, value: &#x22;#000000&#x22; },      ],    },    useColorAlpha: { type: &#x22;boolean&#x22;, label: &#x22;Use color alpha (not opacity)&#x22;, default: false },    nodeOpacity: { type: &#x22;number&#x22;, label: &#x22;Node opacity&#x22;, default: 0.8, min: 0, max: 1, step: 0.05 },    edgeOpacity: { type: &#x22;number&#x22;, label: &#x22;Edge opacity&#x22;, default: 0.1, min: 0, max: 1, step: 0.05 },    edgeSize: { type: &#x22;number&#x22;, label: &#x22;Edge size&#x22;, default: 25, min: 0, max: 100, step: 2.5 },  });  container.style.backgroundColor = bgColor;  const isDarkBg = bgColor === &#x22;#333333&#x22; || bgColor === &#x22;#000000&#x22;;  // Load data  const res = await fetch(&#x22;/data/wikipedia.json&#x22;);  const data: {    nodes: { key: string; label: string; cluster: string; x: number; y: number; score: number }[];    edges: [string, string][];    clusters: { key: string; color: string; clusterLabel: string }[];  } = await res.json();  // Build cluster color map  const clusterColors: Record<string, string> = {};  for (const c of data.clusters) {    clusterColors[c.key] = c.color;  }  // Brighten a hex color by mixing it with white  function brighten(hex: string, amount = 0.5): string {    const r = parseInt(hex.slice(1, 3), 16);    const g = parseInt(hex.slice(3, 5), 16);    const b = parseInt(hex.slice(5, 7), 16);    const mix = (c: number) => Math.round(c + (255 - c) * amount);    return &#x60;#${mix(r).toString(16).padStart(2, &#x22;0&#x22;)}${mix(g).toString(16).padStart(2, &#x22;0&#x22;)}${mix(b).toString(16).padStart(2, &#x22;0&#x22;)}&#x60;;  }  // Convert hex color to rgba with given alpha  function withAlpha(hex: string, alpha: number): string {    const r = parseInt(hex.slice(1, 3), 16);    const g = parseInt(hex.slice(3, 5), 16);    const b = parseInt(hex.slice(5, 7), 16);    return &#x60;rgba(${r}, ${g}, ${b}, ${alpha})&#x60;;  }  const graph = new Graph();  // Add nodes  for (const node of data.nodes) {    const color = clusterColors[node.cluster] || &#x22;#999&#x22;;    const nodeColor = useColorAlpha ? withAlpha(color, nodeOpacity) : color;    const fillColor = brighten(color, 0.5);    graph.addNode(node.key, {      x: node.x,      y: node.y,      score: node.score,      label: node.label,      color: nodeColor,      fillColor: useColorAlpha ? withAlpha(fillColor, nodeOpacity) : fillColor,    });  }  // Add edges, colored by source node  for (const [source, target] of data.edges) {    if (graph.hasNode(source) &#x26;&#x26; graph.hasNode(target)) {      const sourceColor = clusterColors[data.nodes.find((n) => n.key === source)?.cluster ?? &#x22;&#x22;] || &#x22;#999&#x22;;      graph.addEdge(source, target, {        color: useColorAlpha ? withAlpha(sourceColor, edgeOpacity) : sourceColor,      });    }  }  new Sigma(graph, container, {    primitives: {      nodes: {        variables: {          fillColor: { type: &#x22;color&#x22;, default: &#x22;#ccc&#x22; },        },        layers: [          layerBorder({            borders: [              { size: 0.15, color: { attribute: &#x22;color&#x22; }, mode: &#x22;relative&#x22; },              { size: 0, color: { attribute: &#x22;fillColor&#x22; }, fill: true },            ],          }),        ],      },    },    styles: {      nodes: [        DEFAULT_STYLES.nodes,        {          opacity: useColorAlpha ? 1 : nodeOpacity,          size: { attribute: &#x22;score&#x22;, min: 25, max: 100, minValue: 0, maxValue: 0.1 },          ...(isDarkBg ? { labelColor: { whenState: &#x22;isHovered&#x22;, then: &#x22;#000&#x22;, else: &#x22;#fff&#x22; } } : {}),        },      ],      edges: [DEFAULT_STYLES.edges, { opacity: useColorAlpha ? 1 : edgeOpacity, size: edgeSize }],    },  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
