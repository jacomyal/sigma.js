iner {    width: 100%;    height: 100%;  }</style><script>  import Graph from &#x22;graphology&#x22;;  import Sigma, { DEFAULT_STYLES } from &#x22;sigma&#x22;;  import { layerFill, sdfCircle } from &#x22;sigma/rendering&#x22;;  import type { LabelAttachmentContent, LabelAttachmentContext } from &#x22;sigma/types&#x22;;  import { nodeExtent } from &#x22;graphology-metrics/graph/extent&#x22;;  const container = document.getElementById(&#x22;sigma-container&#x22;) as HTMLElement;  // Used to measure text width so the SVG is sized to fit its content.  const measureCtx = document.createElement(&#x22;canvas&#x22;).getContext(&#x22;2d&#x22;)!;  function drawInfoCard({ attributes }: LabelAttachmentContext): LabelAttachmentContent {    const tag = attributes.tag as string;    const clusterLabel = attributes.clusterLabel as string;    const color = attributes.color as string;    measureCtx.font = &#x22;11px sans-serif&#x22;;    const width =      Math.ceil(Math.max(measureCtx.measureText(tag).width, measureCtx.measureText(clusterLabel).width)) + 8;    return {      type: &#x22;svg&#x22;,      svg: &#x60;<svg xmlns=&#x22;http://www.w3.org/2000/svg&#x22; width=&#x22;${width}&#x22; height=&#x22;34&#x22;>        <text x=&#x22;4&#x22; y=&#x22;13&#x22; font-family=&#x22;sans-serif&#x22; font-size=&#x22;11&#x22; fill=&#x22;darkgrey&#x22;>${tag}</text>        <text x=&#x22;4&#x22; y=&#x22;29&#x22; font-family=&#x22;sans-serif&#x22; font-size=&#x22;11&#x22; fill=&#x22;${color}&#x22;>${clusterLabel}</text>      </svg>&#x60;,    };  }  interface Dataset {    nodes: { key: string; label: string; tag: string; cluster: string; x: number; y: number; score: number }[];    edges: [string, string][];    clusters: { key: string; color: string; clusterLabel: string }[];  }  const res = await fetch(&#x22;/data/wikipedia.json&#x22;);  const dataset: Dataset = await res.json();  const clustersByKey = Object.fromEntries(dataset.clusters.map((c) => [c.key, c]));  const graph = new Graph();  dataset.nodes.forEach((node) => {    const cluster = clustersByKey[node.cluster];    graph.addNode(node.key, {      ...node,      clusterLabel: cluster?.clusterLabel,      color: cluster?.color,    });  });  dataset.edges.forEach(([source, target]) => {    graph.addEdge(source, target);  });  const [minScore, maxScore] = nodeExtent(graph, &#x22;score&#x22;);  new Sigma(graph, container, {    primitives: {      nodes: {        shapes: [sdfCircle()],        layers: [layerFill()],        labelAttachments: {          hoverInfo: drawInfoCard,        },      },    },    styles: {      nodes: [        DEFAULT_STYLES.nodes,        {          size: {            attribute: &#x22;score&#x22;,            min: 15,            max: 100,            minValue: minScore,            maxValue: maxScore,          },          labelAttachment: {            whenState: &#x22;isHovered&#x22;,            then: &#x22;hoverInfo&#x22;,          },        },      ],    },    settings: {      labelRenderedSizeThreshold: 6,    },  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
