xtends up to ~y=1.    // We shift p.y by -0.5 to center the heart on the node origin,    // and scale by 0.7 so it fits within the node quad with AA room.    const SCALE = 0.7;    const Y_CENTER = 0.5;    // language=GLSL    const glsl = /*glsl*/ &#x60;float dot2_heart(vec2 v) { return dot(v, v); }float sdf_heart(vec2 uv, float size) {  float scale = ${SCALE.toFixed(4)};  // Normalize to unit space, then shift so the heart&#x27;s center is at the origin  vec2 p = uv / (size * scale);  p.y += ${Y_CENTER.toFixed(4)};  p.x = abs(p.x);  float d;  if (p.y + p.x > 1.0) {    d = sqrt(dot2_heart(p - vec2(0.25, 0.75))) - sqrt(2.0) / 4.0;  } else {    d = sqrt(min(dot2_heart(p - vec2(0.0, 1.0)), dot2_heart(p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);  }  return d * size * scale;}&#x60;;    return {      name: &#x22;heart&#x22;,      glsl,      uniforms: [],      inradiusFactor: 0.5,    };  }  const graph = getSmallGraph();  graph.forEachNode((node) => {    graph.setNodeAttribute(node, &#x22;shape&#x22;, node === &#x22;a&#x22; ? &#x22;circle&#x22; : &#x22;heart&#x22;);  });  new Sigma(graph, container, {    primitives: {      nodes: {        shapes: [sdfCircle(), sdfHeart()],        layers: [layerFill()],      },    },    styles: {      nodes: [DEFAULT_STYLES.nodes, { shape: { attribute: &#x22;shape&#x22; } }],    },  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
