hColor: &#x22;#ffffff99&#x22; },    { head: &#x22;arrow&#x22;, dashSize: 10, dashColor: &#x22;#ffffff99&#x22;, useGradient: true },  ];  const graph = new Graph();  PATHS.forEach((path, row) => {    COLUMNS.forEach((config, col) => {      const [x, y] = [col * 120, -row * 80];      const source = graph.addNode(&#x60;${path}-${col}-source&#x60;, { x: x - 30, y, color: SOURCE_COLOR });      const target = graph.addNode(&#x60;${path}-${col}-target&#x60;, {        x: x + 30,        y: y + 30,        color: TARGET_COLOR,        shape: &#x22;triangle&#x22;,      });      graph.addEdge(source, target, { size: 6, path, curvature: path === &#x22;curved&#x22; ? 0.3 : 0, ...config });    });  });  new Sigma(graph, container, {    primitives: {      nodes: {        shapes: [sdfCircle(), sdfTriangle()],        layers: [layerFill()],      },      edges: {        variables: {          dashColor: { type: &#x22;color&#x22;, default: &#x22;#000&#x22; },          dashSize: { type: &#x22;number&#x22;, default: 0 },          useGradient: { type: &#x22;boolean&#x22;, default: false },        },        paths: [pathLine(), pathCurved(), pathStepCurved(), pathCurvedS()],        extremities: [extremityArrow()],        layers: [          layerPlain({ color: { node: &#x22;source&#x22; } }),          layerGradient({            stops: [{ node: &#x22;source&#x22; }, { node: &#x22;target&#x22; }],            enabled: { attribute: &#x22;useGradient&#x22; },          }),          layerDashed({            dashColor: { attribute: &#x22;dashColor&#x22; },            dashSize: { attribute: &#x22;dashSize&#x22; },            gapSize: { value: 10 },          }),        ],      },    },    styles: {      nodes: [DEFAULT_STYLES.nodes, { size: 12, shape: { attribute: &#x22;shape&#x22; } }],      edges: [        DEFAULT_STYLES.edges,        { path: { attribute: &#x22;path&#x22; }, head: { attribute: &#x22;head&#x22; }, tail: { attribute: &#x22;tail&#x22; } },      ],    },    settings: {      renderEdgeLabels: true,      itemSizesReference: &#x22;positions&#x22;,      autoRescale: true,    },  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
