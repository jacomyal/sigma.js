22;        ? (&#x22;hidden&#x22; as const)        : (&#x22;visible&#x22; as const);  new Sigma(graph, container, {    primitives: {      nodes: {        shapes: [sdfCircle(), sdfSquare(), sdfDiamond(), sdfTriangle()],        layers: [layerFill()],      },    },    styles: {      nodes: [        DEFAULT_STYLES.nodes,        {          size: { attribute: &#x22;size&#x22;, defaultValue: 10 },          shape: { attribute: &#x22;shape&#x22;, defaultValue: &#x22;circle&#x22; },          labelPosition: { attribute: &#x22;labelPosition&#x22;, defaultValue: &#x22;right&#x22; },        },        {          backdropVisibility,          backdropColor: &#x22;white&#x22;,          backdropShadowColor: &#x22;rgba(0, 0, 0, 0.5)&#x22;,          backdropShadowBlur,          backdropPadding,          backdropBorderColor: &#x22;black&#x22;,          backdropBorderWidth,          backdropCornerRadius,          backdropLabelPadding,          backdropArea: &#x22;both&#x22;,          zIndex: 1,        },      ],    },    settings: {      itemSizesReference: &#x22;positions&#x22;,      zoomToSizeRatioFunction: (x: number) => x,      autoRescale: true,    },  });</script>"><div></div></button></div></figure></div> </div> </div> </div> <script type="module">document.querySelectorAll(".tabs .tab").forEach(t=>{t.addEventListener("click",()=>{const a=t.dataset.tab;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("active",e.dataset.tab===a)),document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("active",e.dataset.panel===a))})});</script> </body> </html>
